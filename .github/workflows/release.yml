name: Release
'on':
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        default: patch
        options: [patch, minor, major]
permissions: {}
concurrency: release-${{ github.repository }}
jobs:
  identity:
    name: Select immutable release identity
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
    - name: Require explicit main dispatch
      run: |
        set -euo pipefail
        test "$GITHUB_REF" = refs/heads/main
        test "$GITHUB_EVENT_NAME" = workflow_dispatch
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Check out release helpers
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: nicodes/tools
        ref: 091101094fedf5ce2e67c339c1c9c842d6a662dc
        path: _cli_tools
        persist-credentials: false
    - name: Determine release version
      id: version
      env:
        BUMP: ${{ inputs.bump }}
      run: python3 _cli_tools/scripts/cli_release.py version --bump "$BUMP" --prefix v
  native-cli:
    needs: identity
    uses: ./.github/workflows/native-cli.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.identity.outputs.tag }}
  accept:
    name: Verify full gate and attest accepted archives
    needs: [identity, native-cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: write
      id-token: write
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.identity.outputs.tag }}
      COMMIT: ${{ github.sha }}
      NATIVE_CLI_ARCHIVES: ${{ github.workspace }}/.artifacts/native-cli
    outputs:
      artifact-id: ${{ steps.accepted.outputs.artifact-id }}
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Download native CLI archives
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        pattern: native-cli-*
        merge-multiple: true
        path: .artifacts/native-cli
    - name: Set up development tools
      uses: nicodes/tools/setup@091101094fedf5ce2e67c339c1c9c842d6a662dc
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Check project
      run: mise run check
    - name: Attest accepted release archives
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: |
          dist/*.tar.gz
          dist/*.zip
          dist/checksums.txt
    - name: Upload accepted archives
      id: accepted
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: accepted-cli-${{ github.sha }}-${{ github.run_attempt }}
        path: |
          dist/*.tar.gz
          dist/*.zip
          dist/checksums.txt
        if-no-files-found: error
        retention-days: 7
  publish:
    name: Publish verified archives
    needs: [identity, accept]
    uses: nicodes/tools/.github/workflows/cli-publish.yml@589def59661a722c91f17acbc6c7ef9b41d06189
    permissions:
      contents: write
    with:
      tools-ref: 091101094fedf5ce2e67c339c1c9c842d6a662dc
      binary: spritesmith
      tag: ${{ needs.identity.outputs.tag }}
      artifact-id: ${{ needs.accept.outputs.artifact-id }}
